<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federal Patches</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: white;
      font-family: Arial, sans-serif;
      background: #111;
    }

    header {
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 5%;
      background: #050505;
      border-bottom: 1px solid #444;
    }

    header img {
      width: 150px;
      height: 90px;
      object-fit: contain;
    }

    nav {
      display: flex;
      gap: 20px;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    nav a:hover {
      color: #5865f2;
    }

    main {
      width: 90%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 0;
    }

    h1 {
      margin-bottom: 45px;
      text-align: center;
      font-size: 48px;
    }

    .patch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .patch-card {
      overflow: hidden;
      background: #050505;
      border: 1px solid #444;
      border-radius: 12px;
    }

    .patch-card img {
      width: 100%;
      height: 280px;
      padding: 25px;
      object-fit: contain;
      background: #222;
    }

    .patch-info {
      padding: 22px;
    }

    .patch-info h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .patch-info p {
      margin: 0;
      color: #bbb;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #999;
      background: #000;
    }

    @media (max-width: 800px) {
      .patch-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      header {
        height: auto;
        flex-direction: column;
        gap: 20px;
      }

      nav {
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
      }

      .patch-grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 38px;
      }
    }
  </style>
</head>

<body>

  <header>
    <a href="index.html">
      <img src="./assets/HK.png" alt="HK Logo">
    </a>

    <nav>
      <a href="index.html">Home</a>
      <a href="city.html">City</a>
      <a href="county.html">County</a>
      <a href="state.html">State</a>
      <a href="federal.html">Federal</a>
    </nav>
  </header>

  <main>
    <h1>Federal Patches</h1>

    <section class="patch-grid">

      <article class="patch-card">
        <img
          src="./assets/IMG_7396.JPG"
          alt="United States Secret Service Counter Assault Team"
        >

        <div class="patch-info">
          <h2>United States Secret Service Counter Assault Team</h2>
          <p>Trade</p>
        </div>
      </article>

      <article class="patch-card">
        <img
          src="./assets/HK.png"
          alt="Federal agency patch"
        >

        <div class="patch-info">
          <h2>Federal Agency Patch</h2>
          <p>contact@federal.gov</p>
        </div>
      </article>

    </section>
  </main>

  <footer>
    Police Patch Collection
  </footer>

</body>
</html>
